# Regras de SAST do Marquezi Gestão (Python/Flask e templates Jinja).
# Rodar com: make sast
rules:
  - id: sql-montado-com-texto
    languages: [python]
    severity: ERROR
    message: >-
      A consulta SQL está sendo montada com f-string, %, .format ou +. Se algum
      pedaço vier do usuário, isso permite injeção de SQL (CWE-89). Use "?" e
      passe os valores separados: db.execute("... WHERE id=?", (valor,)).
    pattern-either:
      - pattern: $DB.execute(f"...", ...)
      - pattern: $DB.execute("..." % $X, ...)
      - pattern: $DB.execute("...".format(...), ...)
      - pattern: $DB.execute("..." + $X, ...)
      - pattern: $DB.executescript(f"...")

  - id: flask-modo-debug
    languages: [python]
    severity: ERROR
    message: >-
      O modo debug do Flask expõe um console que executa código Python no
      servidor (CWE-489, CWE-94). Nunca ligue debug=True.
    pattern: $APP.run(..., debug=True, ...)

  - id: chave-secreta-no-codigo
    languages: [python]
    severity: ERROR
    message: >-
      Chave secreta escrita no código-fonte (CWE-798). Quem lê o repositório
      consegue forjar cookies de sessão. Derive a chave de um segredo fora do Git.
    pattern-either:
      - pattern: $APP.secret_key = "..."
      - pattern: $APP.config["SECRET_KEY"] = "..."

  - id: hash-fraco
    languages: [python]
    severity: ERROR
    message: >-
      MD5 e SHA-1 têm colisões conhecidas (CWE-328). Para senhas use scrypt;
      para integridade use SHA-256 ou HMAC-SHA256.
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
      - pattern: hashlib.new("md5", ...)
      - pattern: hashlib.new("sha1", ...)

  - id: aleatorio-previsivel
    languages: [python]
    severity: ERROR
    message: >-
      O módulo random é previsível e não serve para tokens, códigos ou senhas
      (CWE-338). Use o módulo secrets.
    pattern: random.$FUNC(...)

  - id: comando-de-shell
    languages: [python]
    severity: ERROR
    message: >-
      Executar comandos pelo shell permite injeção de comandos (CWE-78).
    pattern-either:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
      - pattern: os.system(...)
      - pattern: os.popen(...)

  - id: execucao-de-codigo-dinamico
    languages: [python]
    severity: ERROR
    message: >-
      eval e exec executam texto como código Python (CWE-95).
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: desserializacao-insegura
    languages: [python]
    severity: ERROR
    message: >-
      pickle, marshal e yaml.load sem SafeLoader podem executar código ao ler
      dados (CWE-502). Use JSON.
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: marshal.loads(...)
      - patterns:
          - pattern: yaml.load(...)
          - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)

  - id: tls-sem-verificacao
    languages: [python]
    severity: ERROR
    message: >-
      A verificação do certificado TLS foi desligada, o que permite ataques de
      intermediário (CWE-295).
    pattern-either:
      - pattern: ssl._create_unverified_context(...)
      - pattern: $CTX.check_hostname = False
      - pattern: $CTX.verify_mode = ssl.CERT_NONE
      - pattern: $LIB.$METHOD(..., verify=False, ...)

  - id: redirecionamento-aberto
    languages: [python]
    severity: ERROR
    message: >-
      Redirecionar para um endereço vindo direto da requisição permite mandar o
      usuário para um site malicioso (CWE-601). Valide que o destino é interno.
    pattern-either:
      - pattern: redirect(request.args.get(...), ...)
      - pattern: redirect(request.form.get(...), ...)
      - pattern: redirect(request.args[...], ...)
      - pattern: redirect(request.form[...], ...)

  - id: html-sem-escape-no-python
    languages: [python]
    severity: ERROR
    message: >-
      Markup e render_template_string desligam o escape automático do Jinja e
      abrem espaço para XSS (CWE-79). Use templates em arquivos.
    pattern-either:
      - pattern: Markup(...)
      - pattern: render_template_string(...)

  - id: template-sem-escape
    languages: [generic]
    severity: ERROR
    paths:
      include: ["*.html"]
    message: >-
      O filtro "safe" ou "autoescape false" desliga o escape automático do Jinja
      e permite XSS (CWE-79).
    pattern-either:
      - pattern-regex: '\|\s*safe\b'
      - pattern-regex: 'autoescape\s+false'

  - id: template-quebra-a-csp
    languages: [generic]
    severity: ERROR
    paths:
      include: ["*.html"]
    message: >-
      Script inline, evento inline (onclick=...) ou style="" no HTML. A CSP do
      servidor bloqueia isso, então o recurso não funcionaria, e afrouxar a CSP
      enfraquece a proteção contra XSS (CWE-79). Use static/app.js e static/style.css.
    pattern-either:
      - pattern-regex: '<script(?![^>]*\bsrc=)[^>]*>'
      - pattern-regex: '\son[a-z]+\s*='
      - pattern-regex: '\sstyle\s*='

  - id: formulario-sem-csrf
    languages: [generic]
    severity: ERROR
    paths:
      include: ["*.html"]
    message: >-
      Formulário POST sem o campo _csrf (CWE-352). Inclua
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">.
    patterns:
      - pattern-regex: '(?s)<form\b[^>]*\bmethod="post"[^>]*>.*?</form>'
      - pattern-not-regex: 'name="_csrf"'
